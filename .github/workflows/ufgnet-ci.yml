name: UFGNet sanity

on:
  pull_request:
    branches: [main]
  push:
    branches: [reproduce-ufgnet]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run degradation and UFGNet tests
        run: |
          pytest -q \
            tests/test_degradation_closure.py \
            tests/test_data_pipeline_degradation.py \
            tests/test_ufgnet.py \
            tests/test_ufgnet_data_protocol.py
      - name: Audit UFGNet parameter counts
        run: |
          python audit_ufgnet.py
