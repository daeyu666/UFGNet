name: UFGNet sanity

on:
  pull_request:
    branches: [main]
  push:
    branches: [reproduce-ufgnet]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run degradation and UFGNet tests
        run: |
          pytest -q tests/test_degradation_closure.py tests/test_data_pipeline_degradation.py tests/test_ufgnet.py
